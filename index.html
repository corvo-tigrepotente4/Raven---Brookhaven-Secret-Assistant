<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Raven AI</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#1e1e1e;
    color:white;
    margin:40px;
}

/* Agency badge */

#agency-badge{
    position:fixed;
    top:15px;
    right:20px;
    display:flex;
    align-items:center;
    gap:10px;
    color:#aaa;
    font-size:14px;
    opacity:0.85;
}

#agency-badge img{
    width:35px;
    height:35px;
    object-fit:contain;
}

/* Creator */

#creator-tag{
    position:fixed;
    bottom:10px;
    left:12px;
    color:#777;
    font-size:12px;
}


/* Chat */

#chat{
    border:1px solid #555;
    height:500px;
    overflow-y:auto;
    padding:10px;
    margin-bottom:10px;
}


input{
    width:80%;
    padding:10px;
    box-sizing:border-box;
}


button{
    padding:10px 20px;
    cursor:pointer;
}


/* Mobile support */

@media(max-width:600px){

    body{
        margin:15px;
    }

    h1{
        font-size:24px;
        margin-top:70px;
    }

    #agency-badge{
        top:10px;
        right:10px;
        font-size:11px;
    }

    #agency-badge img{
        width:28px;
        height:28px;
    }

    #chat{
        height:60vh;
    }

    input{
        width:100%;
        margin-bottom:10px;
    }

    button{
        width:100%;
    }

    #creator-tag{
        font-size:10px;
    }

}

</style>

</head>


<body>


<div id="agency-badge">
    <img src="agency.jpg" alt="Agency Logo">
    <span>PROPERTY OF THE AGENCY</span>
</div>


<div id="creator-tag">
    Made by corvo-tigrepotente4
</div>


<h1>Raven - Brookhaven Secret Hunter</h1>


<div id="chat"></div>


<input
    id="question"
    placeholder="Ask Raven..."
    onkeydown="if(event.key==='Enter') ask();"
/>


<button onclick="ask()">Send</button>



<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>


<script>

let history = [];


async function ask(){

    const input=document.getElementById("question");
    const chat=document.getElementById("chat");

    const q=input.value.trim();

    if(q==="") return;


    chat.innerHTML += `<p><b>You:</b> ${q}</p>`;
    chat.innerHTML += `<p id="loading"><b>Raven:</b> Thinking...</p>`;


    input.value="";


    history.push({
        role:"user",
        content:q
    });



    try{


        const response = await fetch(
            "https://raven-brookhaven-secret-assistant.onrender.com/chat",
            {
                method:"POST",
                mode:"cors",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    question:q,
                    history:history
                })
            }
        );


        if(!response.ok){
            throw new Error("HTTP " + response.status);
        }


        const data = await response.json();


        document.getElementById("loading").remove();


        chat.innerHTML += 
        `<p><b>Raven:</b><br>${marked.parse(data.answer)}</p>`;


        history.push({
            role:"assistant",
            content:data.answer
        });


        if(history.length > 20){
            history = history.slice(-20);
        }


    }


    catch(err){


        document.getElementById("loading").remove();


        chat.innerHTML += 
        `<p style="color:red;"><b>Error:</b> ${err}</p>`;


        console.error(err);

    }


    chat.scrollTop = chat.scrollHeight;

}


</script>


</body>
</html>
