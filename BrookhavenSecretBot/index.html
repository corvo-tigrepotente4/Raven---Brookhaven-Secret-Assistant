<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Raven AI</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#1e1e1e;
    color:white;
    margin:40px;
}

#chat{
    border:1px solid #555;
    height:500px;
    overflow-y:auto;
    padding:10px;
    margin-bottom:10px;
}

input{
    width:80%;
    padding:10px;
}

button{
    padding:10px 20px;
    cursor:pointer;
}
</style>

</head>

<body>

<h1>Raven - Brookhaven Secret Hunter</h1>

<div id="chat"></div>

<input
    id="question"
    placeholder="Ask Raven..."
    onkeydown="if(event.key==='Enter') ask();"
/>

<button onclick="ask()">Send</button>

<script>

async function ask(){

    const input=document.getElementById("question");
    const chat=document.getElementById("chat");

    const q=input.value.trim();

    if(q==="") return;

    chat.innerHTML += `<p><b>You:</b> ${q}</p>`;
    chat.innerHTML += `<p id="loading"><b>Raven:</b> Thinking...</p>`;

    input.value="";

    try{

        const response = await fetch("https:/raven-brookhaven-secret-assistant.onrender.com/chat", {
    method: "POST",
    mode: "cors",
    headers: {
        "Content-Type": "application/json"
    },
    body: JSON.stringify({
        question: q
    })
});

        if(!response.ok){
            throw new Error("HTTP "+response.status);
        }

        const data=await response.json();

        document.getElementById("loading").remove();

        chat.innerHTML += `<p><b>Raven:</b> ${data.answer}</p>`;

    }
    catch(err){

        document.getElementById("loading").remove();

        chat.innerHTML += `<p style="color:red;"><b>Error:</b> ${err}</p>`;

        console.error(err);
    }

    chat.scrollTop=chat.scrollHeight;

}

</script>

</body>
</html>
